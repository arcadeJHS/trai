<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{--fs-base:20px}html{font-size:var(--fs-base);color-scheme:light}body{margin:0;font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F2F4F3}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Training plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">
<style>
/* NEUBRUTALISM, as every page of the site (owner, 2026-10-02): BoldKit's tokens — near-black
   borders and hard shadows, square corners, coral for the action, Outfit — on white. Each runner a
   framed card; the questionnaire link BoldKit's primary button. No percent sign anywhere in this
   template, comments included: it goes through Python's string formatting, which reads one. */
:root{--bk-fg:#17171C;--bk-bg:#FFFFFF;--bk-card:#FFFFFF;--bk-primary:#F37777;--bk-muted-fg:#5C5C66;
  --bk-on-color:#17171C;--bk-bw:3px;--bk-shadow:4px 4px 0 var(--bk-fg)}
body{background:var(--bk-bg);color:var(--bk-fg);font-family:"Outfit",-apple-system,"Segoe UI",sans-serif;font-size:1rem}
.wrap{max-width:40rem;margin:0 auto;padding:2.4rem 1rem 3rem}
.eyebrow{font-weight:700;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bk-muted-fg);margin:0}
h1{font-size:2.4rem;font-weight:800;line-height:1.02;margin:.3rem 0 1.6rem;text-transform:uppercase;
  padding-bottom:.5rem;border-bottom:var(--bk-bw) solid var(--bk-fg)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1rem}
li{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem 1rem;padding:.9rem 1rem;
  border:var(--bk-bw) solid var(--bk-fg);box-shadow:var(--bk-shadow);background:var(--bk-card)}
.runner{font-size:1.5rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
a.runner{color:var(--bk-fg);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
a.runner:hover,a.runner:focus-visible{background:var(--bk-primary);outline:none}
.race{color:var(--bk-muted-fg);font-size:.95rem;flex:1 1 12rem}
.none{color:var(--bk-muted-fg);font-style:italic;font-size:.9rem}
.links{margin-top:2.2rem;font-size:.95rem;color:var(--bk-muted-fg)}
.links a{display:inline-block;margin-left:.3rem;padding:.35rem .8rem;color:var(--bk-on-color);background:var(--bk-primary);
  border:2px solid var(--bk-fg);box-shadow:2px 2px 0 var(--bk-fg);font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;text-decoration:none;transition:transform .08s,box-shadow .08s}
.links a:active{transform:translate(2px,2px);box-shadow:none}
@media (hover:hover){.links a:hover{transform:translate(2px,2px);box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" data-page="home">
<p class="eyebrow">Training plans</p>
<h1>All runners</h1>
<ul>
  <li><a class="runner" href="matteo/">Matteo</a><span class="race">Tenerife Bluetrail 110K, 2028 edition</span></li>
</ul>
<p class="links">New here? Start with the <a href="intake/">intake questionnaire</a>.</p>
</div>
