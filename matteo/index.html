<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{--fs-base:20px}html{font-size:var(--fs-base);color-scheme:light}body{margin:0;font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F2F4F3}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Matteo · Training plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">
<style>
/* The runner's page (2026-10-15): the homepage's neubrutalism — BoldKit's tokens, framed cards, the
   coral action — for one runner's plans. No percent sign anywhere in this template, comments
   included: it goes through Python's string formatting. */
:root{--bk-fg:#17171C;--bk-bg:#FFFFFF;--bk-card:#FFFFFF;--bk-primary:#F37777;--bk-muted-fg:#5C5C66;
  --bk-on-color:#17171C;--bk-bw:3px;--bk-shadow:4px 4px 0 var(--bk-fg)}
body{background:var(--bk-bg);color:var(--bk-fg);font-family:"Outfit",-apple-system,"Segoe UI",sans-serif;font-size:1rem}
.wrap{max-width:40rem;margin:0 auto;padding:2.4rem 1rem 3rem}
.eyebrow{font-weight:700;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bk-muted-fg);margin:0}
h1{font-size:2.4rem;font-weight:800;line-height:1.02;margin:.3rem 0 1.4rem;text-transform:uppercase;
  padding-bottom:.5rem;border-bottom:var(--bk-bw) solid var(--bk-fg)}
h2{font-size:1rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:1.8rem 0 .7rem}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1rem}
li{display:flex;flex-direction:column;gap:.3rem;padding:.9rem 1rem;
  border:var(--bk-bw) solid var(--bk-fg);box-shadow:var(--bk-shadow);background:var(--bk-card)}
.plan{font-size:1.3rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
a.plan{color:var(--bk-fg);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
a.plan:hover,a.plan:focus-visible{background:var(--bk-primary);outline:none}
.meta{color:var(--bk-muted-fg);font-size:.95rem}
.between{font-size:1rem;border-left:var(--bk-bw) solid var(--bk-primary);padding:.2rem 0 .2rem .8rem}
.links{margin:0 0 .4rem}
.links a{display:inline-block;padding:.55rem 1rem;color:var(--bk-on-color);background:var(--bk-primary);
  border:2px solid var(--bk-fg);box-shadow:2px 2px 0 var(--bk-fg);font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;text-decoration:none;transition:transform .08s,box-shadow .08s}
.links a:active{transform:translate(2px,2px);box-shadow:none}
@media (hover:hover){.links a:hover{transform:translate(2px,2px);box-shadow:none}}
.back{margin-top:2.2rem}
.back a{color:var(--bk-fg);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" data-page="runner">
<p class="eyebrow">Training plans</p>
<h1>Matteo</h1>
<p class="links"><a href="today.html">Today’s card</a></p>
<h2>In progress</h2>
<ul>
  <li><a class="plan" href="bluetrail-110k-2028/">Tenerife Bluetrail — 110K</a><span class="meta">race 7 Apr 2028</span></li>
</ul>
<p class="back"><a href="../">← All runners</a></p>
</div>
