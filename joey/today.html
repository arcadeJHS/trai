<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{--fs-base:20px}html{font-size:var(--fs-base);color-scheme:light}body{margin:0;font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F2F4F3}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Daily Card · Joey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800;900&display=swap">
<style>
/* NEUBRUTALISM (owner, 2026-10-02: "restyle the entire today page according to the ideas of
   neubrutalism", BoldKit as the reference). The tokens are BoldKit's own, read from its source
   (github.com/ANIBIT14/boldkit: src/styles/globals.css and the accordion, button, card, table and
   alert components): 3px near-black borders, hard 4px 4px 0 shadows with no blur, square corners,
   coral / teal / yellow, Outfit, bold uppercase titles. The page itself is white (owner, the same
   day), not BoldKit's off-white. The plan page follows the same tokens (its shells and
   templates/plan.skeleton.html, 2026-10-02), so the two pages open alike. */
:root{
  --bk-fg:#17171C;        /* hsl(240 10% 10%) — text, every border, every shadow */
  --bk-bg:#FFFFFF;        /* the page */
  --bk-card:#FFFFFF;      /* boxes */
  --bk-primary:#F37777;   /* hsl(0 84% 71%) coral — the one action: Copy */
  --bk-secondary:#49D4C6; /* hsl(174 62% 56%) teal — the status strip */
  --bk-pink:#FF4DA6;      /* hsl(330 100% 65%) BoldKit's --neon-pink — the strip, for a female runner */
  --bk-accent:#FFE46B;    /* hsl(49 100% 71%) yellow — open, selected, asking */
  --bk-muted:#E6E6E2;     /* hsl(60 5% 90%) */
  --bk-muted-fg:#5C5C66;  /* hsl(240 5% 38%) */
  --bk-danger:#DC1313;    /* hsl(0 84% 47%) */
  --bk-danger-fg:#FFFFFF;
  --bk-on-color:#17171C;  /* text on coral, teal and yellow: white fails contrast on all three */
  --bk-bw:3px;
  --bk-shadow:4px 4px 0 var(--bk-fg);
  --bk-shadow-sm:2px 2px 0 var(--bk-fg);
  --bk-shadow-lg:8px 8px 0 var(--bk-fg);   /* BoldKit's .bk-shadow-lg — the key sections only */
  --bk-sans:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --bk-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
/* Light by default, whatever the device says (owner, 2026-10-01). BoldKit's `.dark` values stay
   below under [data-theme="dark"], for a switch if one is ever wanted. */
:root[data-theme="dark"]{
  --bk-fg:#FAFAF8; --bk-bg:#17171C; --bk-card:#202027; --bk-muted:#2E2E38; --bk-muted-fg:#A1A1AA;
}
*{box-sizing:border-box}
body{background:var(--bk-bg);color:var(--bk-fg);margin:0;
  font-family:var(--bk-sans);font-size:1rem;line-height:1.6;  /* 1rem = --fs-base, the one base size: bin/athlete.py:document */
  -webkit-font-smoothing:antialiased}
.mono,code,pre{font-family:var(--bk-mono)}
:focus-visible{outline:3px solid var(--bk-fg);outline-offset:3px}

/* The top bar says only the name of the thing (owner, 2026-10-13: "trAI"). It showed the plan
   version and the write time until then; both stay on it as a tooltip (paint()), so a card from a
   superseded plan can still be told apart by whoever looks for it. */
.stamp{position:sticky;top:0;z-index:10;background:var(--bk-fg);color:var(--bk-bg);
  font-family:var(--bk-mono);font-size:.7rem;letter-spacing:.04em;
  padding:.3rem .7rem;display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap}
.stamp b{font-weight:600}
.stamp .brand{font-weight:600;letter-spacing:.08em}
.stamp a{color:inherit}

/* --- the strip: whose card, and their race — the race a link to their plan (owner, 2026-10-13).
   Teal, pink for a female runner; RED, with the date, when the card is not today's: the page's
   first job is still answering "is this for today?". Its sides match the stamp's (.7rem). --- */
.status{position:sticky;top:1.55rem;z-index:9;display:flex;flex-wrap:wrap;
  align-items:baseline;gap:.35rem .9rem;padding:.5rem .7rem;
  font-family:var(--bk-mono);font-size:.76rem;letter-spacing:.03em;
  background:var(--bk-secondary);color:var(--bk-on-color);border-bottom:var(--bk-bw) solid var(--bk-fg)}
.status.female{background:var(--bk-pink)}
.status.stale{background:var(--bk-danger);color:var(--bk-danger-fg)}
.status .who{text-transform:uppercase;letter-spacing:.06em}
.status b{font-weight:600}
.status .grow{flex:1 1 auto}
.status a{color:inherit;font-weight:600}

/* Half the window, centred, never narrower than 680px and never past a phone's 92vw (owner,
   2026-10-02: "the central column is very narrow"). The text fills it: no 64ch cap below. */
.wrap{width:min(92vw,max(680px,50vw));margin:0 auto;padding:1.6rem 0 5rem}

header.card-head{display:flex;flex-direction:column;gap:.6rem;
  padding-bottom:1.1rem;border-bottom:var(--bk-bw) solid var(--bk-fg);margin-bottom:1.6rem}
.eyebrow{font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bk-muted-fg);margin:0}
h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.05;margin:0;font-weight:800;
  letter-spacing:-.005em;text-transform:uppercase;text-wrap:balance}
/* Two lines: the long date, then the headline (owner, 2026-10-02). */
h1 .h1-line{display:block}
/* The masthead's two lines (owner, 2026-10-13): the card's date, then the week. */
.eyebrow .eb-line{display:block}
.tags{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.3rem}
.tag{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  color:var(--bk-fg);background:var(--bk-card);border:2px solid var(--bk-fg);
  box-shadow:var(--bk-shadow-sm);padding:.15rem .55rem;white-space:nowrap}
.tag b{font-weight:800}
.tag.shipped{background:var(--bk-danger);color:var(--bk-danger-fg)}

/* ============================================================================
   templates/lib/card.css — HOW A CARD LOOKS, wherever it is shown: the daily card page
   (templates/daily-card.shell.html) and the plan page's diary, the panel under an open day
   (every plan shell, from templates/plan.skeleton.html). Spliced into each page's <style> at
   build time by bin/card-embed.py and bin/plan-embed.py, at a line that says @@include card.css
   inside a comment — one copy, so the diary cannot drift from the card (owner, 2026-10-02:
   "could we use the same exact styles already used for the single today card?").

   Every rule is scoped under .card, or names the folds and the session box, so the plan page's
   own styles keep their elements and these keep the card's. Where a plan page's global rule
   would reach a card element (every section a flex column, every table framed, every
   paragraph capped at 66ch) a reset here says no. The tokens (--bk-*) are each page's own,
   defined identically in both.
   ============================================================================ */
/* --- the rendered card --- */
.card h2{font-size:1.3rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  margin:2.1rem 0 .7rem;padding-bottom:.35rem;border-bottom:var(--bk-bw) solid var(--bk-fg);text-wrap:balance}
.card h3{font-size:.95rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--bk-fg);margin:1.5rem 0 .5rem}
.card p{margin:0 0 .85rem;max-width:none}
.card ul,.card ol{margin:0 0 .95rem;padding-left:1.15rem;display:flex;
  flex-direction:column;gap:.32rem}
.card strong{font-weight:700}
.card a{color:var(--bk-fg);text-decoration-thickness:2px;text-underline-offset:2px;word-break:break-word}
.card blockquote{margin:1.1rem 0;padding:.8rem 1rem;border:var(--bk-bw) solid var(--bk-fg);
  background:var(--bk-muted);box-shadow:var(--bk-shadow);font-size:.96rem}
.card blockquote.warn{background:var(--bk-accent);color:var(--bk-on-color)}
.card blockquote p:last-child{margin-bottom:0}
.card code{font-size:.88em;background:var(--bk-muted);padding:.08em .32em}
.card pre{background:var(--bk-card);border:var(--bk-bw) solid var(--bk-fg);box-shadow:var(--bk-shadow);
  padding:.75rem .9rem;overflow-x:auto;font-size:.85rem;line-height:1.5;margin:1rem 0}
.card pre code{background:none;padding:0}
/* BoldKit's table: the frame and the shadow on the wrapper (its own overflow does not clip its
   shadow), the header muted, bold and uppercase. Row rules 2px rather than BoldKit's 3px — the
   fuel tables are dense — and no zebra. */
.card .scroll{overflow-x:auto;margin:1rem 0 1.3rem;padding:0;border:var(--bk-bw) solid var(--bk-fg);
  box-shadow:var(--bk-shadow);background:var(--bk-card)}
.card table{border-collapse:collapse;width:100%;font-size:.87rem;border:0;box-shadow:none;background:none}
.card th,.card td{text-align:left;padding:.5rem .65rem;border-bottom:2px solid var(--bk-fg);
  vertical-align:top}
.card tbody tr:last-child td{border-bottom:0}
.card th{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;
  color:var(--bk-fg);background:var(--bk-muted);border-bottom:var(--bk-bw) solid var(--bk-fg);white-space:nowrap}
.card td:first-child{font-variant-numeric:tabular-nums}

/* --- the accordions: the log form, Fuel today and the recap, ONE look (owner, 2026-10-02: "the
   same exact style" as Log this session) — each selector below names the form's class and the
   folds' together, so the three cannot drift apart. BoldKit's accordion: a framed, shadowed
   item; a white header, bold and uppercase, muted under the pointer and YELLOW WHEN OPEN; the
   body under a 3px rule; the caret at the right, drawn here from `aria-expanded` for all three
   (log-form.js sets it on the form's toggle as fold() does on the card's folds, and foldHTML()
   on the diary's). The folds' heading is the button, inside an H2 that adds nothing. --- */
.fold-sec,.session-box{display:block}   /* a plan page makes every <section> a flex column */
.logform,.fold-sec{margin:1.8rem 0 0;border:var(--bk-bw) solid var(--bk-fg);box-shadow:var(--bk-shadow);
  background:var(--bk-card)}
.lf-toggle,.fold{width:100%;display:flex;justify-content:space-between;align-items:center;gap:.8rem;
  text-align:left;font-family:var(--bk-sans);font-size:1.05rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;padding:.9rem 1rem;min-height:3rem;border:0;cursor:pointer;
  background:var(--bk-card);color:var(--bk-fg)}
.lf-body,.fold-body{padding:.9rem 1rem .2rem;border-top:var(--bk-bw) solid var(--bk-fg)}
.card h2.fold-h{margin:0;padding:0;border:0}
.lf-toggle::after,.fold::after{content:"▾";font-size:1.15em;line-height:1}
@media (hover:hover){.lf-toggle:hover,.fold:hover{background:var(--bk-muted)}}
.lf-toggle[aria-expanded="true"],.fold[aria-expanded="true"]{background:var(--bk-accent);color:var(--bk-on-color)}
.lf-toggle[aria-expanded="true"]::after,.fold[aria-expanded="true"]::after{content:"▴"}

/* --- the KEY sections: the session and Log this session (owner, 2026-10-02: "more important
   and should be highlighted more than the others"). BoldKit's card with a coloured header and its
   deeper shadow, .bk-shadow-lg: each section of the session part — Strength, Running
   (card-render.js:sessionBoxes, owner 2026-10-13: "two visually separated sections") — is its own
   framed box whose heading is a teal title bar; the log form keeps the accordions' shared rules
   above and only changes its header to coral, the action colour, open or closed (that rule is the
   card page's: the diary has no form). Fuel today and the recap stay white at 4px. --- */
.key{box-shadow:var(--bk-shadow-lg)}
.session-box{--pad:1rem;border:var(--bk-bw) solid var(--bk-fg);background:var(--bk-card);padding:0 var(--pad) .2rem}
.session-box + .session-box{margin-top:2rem}
.session-box > h2:first-child{margin:0 calc(-1 * var(--pad)) .9rem;padding:.75rem var(--pad);
  background:var(--bk-secondary);color:var(--bk-on-color);border-bottom:var(--bk-bw) solid var(--bk-fg)}
.session-box > :first-child:not(h2){margin-top:.9rem}
/* On a phone the box's padding and the cells' come in, so the session table keeps its width
   inside the frame instead of scrolling sideways (measured at 500px wide, 2026-10-02). */
@media (max-width:600px){
  .session-box{--pad:.55rem}
  .card th,.card td{padding:.42rem .45rem}
}
/* The two boxes above the card are BoldKit alerts: red when it is urgent, yellow when it asks. */
.health{margin:1rem 0 1.6rem;padding:.9rem 1rem;border:var(--bk-bw) solid var(--bk-fg);
  box-shadow:var(--bk-shadow);background:var(--bk-danger);color:var(--bk-danger-fg);font-size:.95rem}
.health.later,.health.soon{background:var(--bk-accent);color:var(--bk-on-color)}
.health h2{margin:0 0 .4rem;font-size:1.05rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.health ul{margin:.2rem 0 .5rem 1.1rem;padding:0}
.health code{font-weight:700}
/* the five-minute strength test — yellow, the colour of a box that asks rather than warns */
.strength-test{margin:1rem 0 1.6rem;padding:.9rem 1rem;border:var(--bk-bw) solid var(--bk-fg);
  box-shadow:var(--bk-shadow);background:var(--bk-accent);color:var(--bk-on-color);font-size:.95rem}
.strength-test.physio{background:var(--bk-danger);color:var(--bk-danger-fg)}
.strength-test h2{margin:0 0 .4rem;font-size:1.05rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.strength-test h3{margin:1rem 0 .2rem;font-size:.95rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.strength-test p{margin:.4rem 0}
.strength-test a{color:inherit}
.strength-test table{border-collapse:collapse;width:100%;font-size:.85rem}
.strength-test th,.strength-test td{text-align:left;vertical-align:top;padding:.35rem .5rem;
  border-bottom:1px solid currentColor}
.strength-test th{font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:.75rem}
.strength-test pre{white-space:pre-wrap;margin:.3rem 0;font-size:.85rem}
.key .lf-toggle{background:var(--bk-primary);color:var(--bk-on-color)}

/* --- the log form (templates/lib/log-form.js): the app's log screen, first built here. Big tap
   targets, scales as rows of numbered buttons, nothing to type on an ordinary day. BoldKit's
   buttons: framed and shadowed, and a press moves them into their shadow — on tap everywhere,
   on hover only where there is a pointer. --- */
.lf-intro{font-size:.92rem;color:var(--bk-muted-fg);margin:.6rem 0}
.lf-g{border:0;border-top:2px solid var(--bk-fg);margin:1rem 0 0;padding:.8rem 0 0}
.lf-g legend{font-weight:800;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--bk-fg);padding:0 .4rem 0 0}
.lf-q{margin:.55rem 0 .8rem}
.lf-l{font-size:.95rem;margin:.2rem 0 .35rem}
.lf-h{display:block;font-size:.8rem;color:var(--bk-muted-fg)}
.lf-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.lf-b{min-width:2.75rem;min-height:2.75rem;padding:.35rem .7rem;font:inherit;font-size:.95rem;font-weight:700;
  border:2px solid var(--bk-fg);background:var(--bk-card);color:var(--bk-fg);box-shadow:var(--bk-shadow-sm);
  cursor:pointer;transition:transform .08s,box-shadow .08s}
.lf-b:active{transform:translate(2px,2px);box-shadow:none}
@media (hover:hover){.lf-b:hover{transform:translate(2px,2px);box-shadow:none}}
.lf-b.on{background:var(--bk-accent);color:var(--bk-on-color);font-weight:800}
.lf-in{font:inherit;font-size:1rem;min-height:2.75rem;padding:.35rem .6rem;border:2px solid var(--bk-fg);
  background:var(--bk-card);color:var(--bk-fg);max-width:100%}
input.lf-in[type="number"]{width:6.5rem}
.lf-note{width:100%}
.lf-left{margin:.2rem 0 .7rem;padding:0 1rem;font-family:var(--bk-mono)}
.lf-u{font-size:.85rem;color:var(--bk-muted-fg);margin-right:.6rem}
.lf-ex{margin:.5rem 0 .8rem;padding:.5rem 0;border-bottom:2px dashed var(--bk-muted-fg)}
.lf-exn{font-weight:700;margin-bottom:.3rem}
.lf-ex .lf-in{margin-top:.4rem;width:100%}
.lf-out{padding:.6rem 1rem 1rem;border-top:var(--bk-bw) solid var(--bk-fg)}
.lf-progress{font-family:var(--bk-mono);font-size:.8rem;color:var(--bk-muted-fg);margin:.6rem 0}
.lf-preview{white-space:pre-wrap;font-size:.8rem;background:var(--bk-muted);border:2px solid var(--bk-fg);
  padding:.6rem .8rem;max-height:16rem;overflow:auto}
.lf-actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.7rem}
.lf-actions .lf-b[data-act="copy"]{background:var(--bk-primary);color:var(--bk-on-color);
  border:var(--bk-bw) solid var(--bk-fg);box-shadow:var(--bk-shadow);font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;min-width:7rem}
.lf-actions .lf-b[data-act="copy"]:active{transform:translate(4px,4px);box-shadow:none}
@media (hover:hover){.lf-actions .lf-b[data-act="copy"]:hover{transform:translate(4px,4px);box-shadow:none}}
.lf-note-out{font-size:.88rem;font-weight:700;color:var(--bk-fg)}
.lf-copy{width:100%;margin-top:.5rem;font-size:.75rem;border:2px solid var(--bk-fg)}

/* The advice under the sessions on a lifting day (owner, 2026-10-13): a BoldKit alert, yellow —
   the colour of a box that asks rather than warns. */
.rpe-note{margin:2rem 0 0;padding:.8rem 1rem;border:var(--bk-bw) solid var(--bk-fg);box-shadow:var(--bk-shadow);
  background:var(--bk-accent);color:var(--bk-on-color);font-size:.95rem}
.rpe-note h2{margin:0 0 .35rem;font-size:1rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.rpe-note p{margin:0}
/* The order of a two-session day, above the sessions (owner, 2026-10-20): a BoldKit alert, yellow
   like the advice under them, so it is read before the first box. */
.order-note{margin:0 0 1.6rem;padding:.7rem 1rem;border:var(--bk-bw) solid var(--bk-fg);box-shadow:var(--bk-shadow);
  background:var(--bk-accent);color:var(--bk-on-color);font-weight:700}
/* The four reference pages (owner, 2026-10-13): BoldKit buttons, as the homepage's links. */
.refs{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem .7rem;margin:1.6rem 0 1.2rem}
.refs .refs-h{font-weight:800;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bk-muted-fg);flex:0 0 100%}
.refs a{display:inline-block;padding:.4rem .8rem;color:var(--bk-fg);background:var(--bk-card);
  border:2px solid var(--bk-fg);box-shadow:var(--bk-shadow-sm);font-weight:800;font-size:.85rem;
  letter-spacing:.05em;text-transform:uppercase;text-decoration:none;transition:transform .08s,box-shadow .08s}
.refs a:active{transform:translate(2px,2px);box-shadow:none}
@media (hover:hover){.refs a:hover{transform:translate(2px,2px);box-shadow:none;background:var(--bk-muted)}}
/* The card's standing note, above the references and the log form (owner, 2026-10-02: it was a
   footer under a grey rule; the footer is gone; 2026-10-20: before the references). Read as one
   more paragraph of the card. */
.card-note{margin:1.6rem 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- paper: bin/topdf.py prints this page with headless Chrome. PLAIN ON PAPER (owner,
   2026-10-02): the borders stay, thinner; the hard shadows and the colour fills go — every fill
   token turns white and every text ink — so the PDF saves ink and reads in grey. The sticky bars
   become plain rows, and no table or heading is split across a page. --- */
@media print{
  :root,:root[data-theme="dark"]{
    --bk-fg:#17171C; --bk-bg:#FFFFFF; --bk-card:#FFFFFF;
    --bk-primary:#FFFFFF; --bk-secondary:#FFFFFF; --bk-pink:#FFFFFF; --bk-accent:#FFFFFF; --bk-muted:#FFFFFF;
    --bk-muted-fg:#5C5C66; --bk-danger:#FFFFFF; --bk-danger-fg:#17171C; --bk-on-color:#17171C;
    --bk-bw:2px; --bk-shadow:none; --bk-shadow-sm:none; --bk-shadow-lg:none;
    --fs-base:12pt;   /* paper keeps the size it always printed at (16px); the screen's base is bin/athlete.py's */
  }
  @page{size:A4;margin:14mm 14mm 16mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:11pt;line-height:1.5}
  .stamp,.status{position:static}
  .stamp{background:none;color:var(--bk-fg);border-bottom:var(--bk-bw) solid var(--bk-fg)}
  .stamp a{display:none}
  .wrap{width:auto;max-width:none;padding:.8rem 0 0}
  .card table,.card tr,.card blockquote{break-inside:avoid;page-break-inside:avoid}
  h1,h2,h3,.card th{break-after:avoid;page-break-after:avoid}
  .status a{text-decoration:none}   /* the race name stays on paper; its link does not matter there */
  .logform{display:none}
  .refs{display:none}           /* a link on paper goes nowhere */
  .fold-body[hidden]{display:block!important}   /* the paper card carries every fold, open */
  .fold::after{content:none}
}
</style>

<div class="stamp" id="stamp"><span class="brand" id="stampL">trAI</span><a id="homelink" href="../">…</a></div>
<div class="status" id="status"><span class="grow" id="statusText">…</span></div>

<div class="wrap">
  <header class="card-head">
    <p class="eyebrow"><span class="eb-line" id="eb-date">&nbsp;</span><span class="eb-line" id="eb-week"></span><span class="eb-line" id="eb-phase"></span></p>
    <h1 id="title"><span class="h1-line" id="title-head"></span></h1>
    <div class="tags" id="tags"></div>
  </header>
  <div id="health"></div>
  <div id="strength-test"></div>
  <!-- The session — the card's part before the fuel — one KEY box per section (owner, 2026-10-13:
       Strength and Running "visually separated"; 2026-10-02: framed, its heading a teal title bar,
       the deeper shadow), painted by card-render.js:sessionBoxes. -->
  <!-- A two-session day says its order first (owner, 2026-10-20: "Today two sessions: strength and
       run. Do them in any order" — or which goes first): painted from the card's `order:` and the
       log form's sessions, in the runner's language; hidden on a one-session day. -->
  <p class="order-note" id="order-note" hidden></p>

      }
      if (/^\|/.test(L)) {                        // rows with no header and no |---| line —
        var rows = [];                           // "| Totals | ~280 g | ~126 g |" (mobile §29)
        while (i < lines.length && /^\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
        out.push('<div class="scroll"><table><tbody>' + rows.map(function (r) {
          return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
        }).join("") + "</tbody></table></div>");
        continue;
      }
      if (/^>\s?/.test(L)) {
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, "")); i++; }
        var text = q.join("\n"), warn = /⚠/.test(text) ? " warn" : "";
        out.push('<blockquote class="q' + warn + '">' + render(text) + "</blockquote>");
        continue;
      }
      if (/^\s*[-*·]\s+/.test(L)) {
        var ul = [];
        while (i < lines.length && /^\s*[-*·]\s+/.test(lines[i])) {
          var item = lines[i].replace(/^\s*[-*·]\s+/, ""); i++;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*[-*·]\s+/.test(lines[i]) &&
                 !/^\s{4,}\S/.test(lines[i])) { item += " " + lines[i].trim(); i++; }
          ul.push(item);
        }
        flushList("ul", ul); continue;
      }
      if (/^\s*\d+\.\s+/.test(L)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          var it = lines[i].replace(/^\s*\d+\.\s+/, ""); i++;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])) {
            it += " " + lines[i].trim(); i++;
          }
          ol.push(it);
        }
        flushList("ol", ol); continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^[#>|]/.test(lines[i]) &&
             !/^\s*([-*·]|\d+\.)\s+/.test(lines[i]) && !/^\s{4,}\S/.test(lines[i])) {
        para.push(lines[i].trim()); i++;
      }
      // A line no branch above took ("##### x", "#tag") must still be consumed: without this
      // `i` never moved and the page spun forever — two model cards did that (mobile §29).
      if (!para.length) { para.push(lines[i].trim()); i++; }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  /* ---- the card cut for display (owner, 2026-10-02) ------------------------------------
     ONE cut, for the daily card and the plan page's diary, so the two show a card the same
     way: the session part — everything before the fuel section — open; then the fuel section
     (from the language's `fuel_heading`, verbatim, optionally followed by a subtitle, to the
     next H2) and every section after it, each folded, the recap — `recap_heading` — LAST
     wherever it was written: cards archived before 2026-10-02 carry it first, and an old
     card's "Afterwards" becomes a fold of its own. Nothing is dropped. No fuel section: the
     whole card is the session part and nothing folds. */
  function cutCard(md) {
    var lines = md.split("\n"), secs = [{title: "", lines: []}], k, h;
    for (k = 0; k < lines.length; k++) {
      h = /^##\s+(.+)$/.exec(lines[k]);
      if (h) secs.push({title: h[1], lines: []});
      else secs[secs.length - 1].lines.push(lines[k]);
    }
    var fuel = -1, recap = -1;
    for (k = 1; k < secs.length; k++) {
      if (fuel < 0 && secs[k].title.indexOf(t("fuel_heading")) === 0) fuel = k;
      if (recap < 0 && secs[k].title.indexOf(t("recap_heading")) === 0) recap = k;
    }
    if (fuel < 0) return {session: md, fuelTitle: "", fuel: "", folds: []};
    var session = [], folds = [];
    for (k = 0; k < fuel; k++) {
      if (k !== recap) session.push((secs[k].title ? "## " + secs[k].title + "\n" : "") + secs[k].lines.join("\n"));
    }
    for (k = fuel + 1; k < secs.length; k++) {
      if (k !== recap) folds.push({title: secs[k].title, md: secs[k].lines.join("\n")});
    }
    if (recap >= 0) folds.push({title: secs[recap].title, md: secs[recap].lines.join("\n")});
    return {session: session.join("\n"), fuelTitle: secs[fuel].title,
            fuel: secs[fuel].lines.join("\n"), folds: folds};
  }

  /* ---- the session part, one KEY box per section (owner, 2026-10-13) --------------------
     "When there are 2 sessions in the today card … clearly separate them in two visually
     separated sections, Strength and Running": the run was a paragraph lost under the strength
     tables. So every `##` of the session part is its own framed box, its heading the teal title
     bar — `## Strength` and `## Running` on a stacked day (bin/check.py:rule_card_sessions), the
     warm-up and the working sets `###` inside the first. Anything before the first `##` is a box
     with no bar — but only if it paints something: the card's H1 sits there and renders to
     nothing (the page shows it in the masthead), and it drew an empty frame above Strength
     (owner, 2026-10-13: "the empty borders of an empty section"). ONE function for the daily card
     and the plan page's diary, so the two cannot draw a session two ways; card.css styles it. */
  function sessionBoxes(md) {
    var parts = md.split(/^(?=##\s)/m), out = [], h;
    for (var k = 0; k < parts.length; k++) {
      h = render(parts[k]);
      if (h.trim()) out.push('<section class="key session-box">' + h + "</section>");
    }
    return out.join("\n");
  }

  /* A folded section, as a string — the diary's. The daily card's #fuel and #recap are this
     markup written into its shell and painted by its fold(); templates/lib/card.css styles both.
     `key` names the fold for the page's delegated click; it is CLOSED unless `open`. */
  function foldHTML(key, title, bodyHtml, open) {
    return '<section class="card fold-sec"><h2 class="fold-h"><button type="button" class="fold"' +
      ' data-fold="' + esc(key) + '" aria-expanded="' + (open ? "true" : "false") + '"><span>' +
      inline(title) + '</span></button></h2><div class="fold-body"' + (open ? "" : " hidden") + ">" +
      bodyHtml + "</div></section>";
  }

    /* ===========================================================================
     templates/lib/log-form.js — the "log this session" form on the DAILY CARD, under the session
     and before the folded fuel and recap.
     Spliced into the card page's program only (bin/card-embed.py, `//@@include log-form.js`);
     never into the plan page, whose diary must stay a record. ES5, like card-render.js, and
     it uses that file's esc().

     Owner, 2026-10-01: the runner should think about training, not about the system. So: tap
     what fits, skip what you like (a skip is sent as `?`, explicitly), press Copy, paste into
     Claude. The fields, their ranges and their order are NOT defined here: they come from the
     payload's `log_form.fields`, which is bin/logform.py's FIELDS — the one contract the parser
     behind /log reads back (lesson 5: two implementations, one contract, and test/attack.py
     feeds this composer's output to that parser). The labels are the payload's `form_i18n`, in
     the athlete's language. The answers live in `V`; a tap repaints the form, typing only
     repaints the preview, so a field never loses the cursor.

     Nothing here may contain the text that opens a script element: bin/card-embed.py counts
     them, and a page with a third would be refused.
     =========================================================================== */

  function composeLog(spec, v) {
    v = v || {};
    var L = ["/log", "logform v" + spec.version + " " + spec.for_date, "input_mode: form",
             "card: " + spec.card.modality + " · " + spec.card.intensity];
    var fields = spec.fields || [];
    function of(g) { return fields.filter(function (f) { return f.group === g; }); }
    function val(x) {
      if (x === undefined || x === null || x === "") return "?";
      return String(x).replace(/[\r\n]+/g, " ").replace(/\s+/g, " ").trim() || "?";
    }
    function put(k, x) { L.push(k + ": " + val(x)); }
    var did = v.did || "?";
    put("did", did);
    if (did === "skipped") put("skip_reason", v.skip_reason);
    /* an `hours` field is two inputs, h and min, sent as `7 h 30′` (2026-10-13) — the runner reads
       the block, so it is not a decimal hour */
    of("morning").forEach(function (f) { put(f.key, f.kind === "hours" ? hm(v[f.key + "_h"], v[f.key + "_m"]) : v[f.key]); });
    if (spec.weekly) of("weekly").forEach(function (f) { put(f.key, v[f.key]); });
    /* A session is sent when the runner said the card happened as written (did = proposed), or
       when they answered something about it, picked its type, or added it — a type pre-selected
       from the card is not a report, and a blank form must never invent a session the parser would
       log. Under "different" too (2026-10-08, dry run 4): it used to send every session, so a
       card's untouched second session — a run, even under an open injury flag — went into the log
       as a run nobody did. The runner can always enter what they did instead: any type, up to the
       spec's max_sessions, each one removable. */
    function touched(s) {
      for (var k in s) if (k !== "type" && k !== "ex" && k !== "fuel" && s[k] !== "" && s[k] != null && s[k] !== false) return true;
      if ((s.fuel || []).length) return true;
      for (var n in (s.ex || {})) if (s.ex[n] && (s.ex[n].status || s.ex[n].load)) return true;
      return false;
    }
    if (did === "proposed" || did === "different" || (did === "?" && (v.sessions || []).some(touched))) {
      (v.sessions || []).filter(function (s) { return did === "proposed" || touched(s); }).forEach(function (s, i) {
        var p = "s" + (i + 1) + ".";
        put(p + "type", s.type);
        if (s.type !== "gym") put(p + "dur", duration(s));     /* a lift's minutes debit nothing (owner, 2026-10-20) */
        put(p + "start", s.start);
        if (s.type === "gym") {
          put(p + "reps_left", s.reps_left);
          (spec.exercises || []).forEach(function (e) {
            var x = (s.ex || {})[e.n] || {};
            var name = String(e.name).replace(/·/g, "-");
            L.push(p + "ex" + e.n + ": " + (x.status
              ? name + " · " + x.status + (x.load ? " · " + val(x.load).replace(/·/g, "-") : "")
              : "?"));
          });
        } else {
          of("endurance").forEach(function (f) {
            /* the food list (owner, 2026-10-20): one line per row the runner added, nothing when
               none — `s1.fuel1: bar · 3 · 40 · 6`, the type, how many, the grams of carbohydrate
               and of protein IN ONE (both optional, a blank is `?`), and what it was for `other` */
            if (f.kind === "fuel") {
              (s.fuel || []).forEach(function (r, j) {
                L.push(p + "fuel" + (j + 1) + ": " + [r.kind, r.qty, r.carb, r.prot].map(val).join(" · ") +
                       (r.kind === "other" ? " · " + val(r.what).replace(/·/g, "-") : ""));
              });
              return;
            }
            put(p + f.key, f.key === "down" && s.same ? s.up : s[f.key]);
          });
        }
      });
    }
    if (spec.hill) of("hill").forEach(function (f) { put(f.key, (v.hill || {})[f.key.slice(5)]); });
    put("pain", v.pain);
    if (v.pain === "yes")
      ["pain_where", "pain_side", "pain_kind", "pain_changed_run"].forEach(function (k) { put(k, v[k]); });
    put("tomorrow_start", v.tomorrow_start);
    /* the eve of a lift day only: the lift's own start (2026-10-27, docs/plan-lift-start.md) */
    if (spec.tomorrow_lift) put("tomorrow_lift", v.tomorrow_lift);
    if (spec.rebuild) put("rebuild", v.rebuild);
    put("note", v.note);
    return L.join("\n");
  }

  function duration(s) { return hm(s.dur_h, s.dur_m); }

  function hm(hh0, mm0) {      /* 7.5 in the hours box is 7 h 30′, and 90 min is 1 h 30′ — never a silent truncation */
    var h = parseFloat(hh0), m = parseFloat(mm0);
    if (isNaN(h) && isNaN(m)) return "";
    var t = Math.round((isNaN(h) ? 0 : h) * 60 + (isNaN(m) ? 0 : m));
    var hh = Math.floor(t / 60), mm = t % 60;
    return hh ? hh + " h" + (mm ? " " + mm + "′" : "") : mm + "′";
  }

  function paintLogForm(card, el, F) {
    var spec = card && card.log_form, root = el && el.section;
    if (!root) return;
    if (!spec || !F) { root.hidden = true; return; }
    root.hidden = false;
    spec.rebuild = !!(card.health && card.health.fired && card.health.fired.length);
    var KEY = "logform:" + spec.user + ":" + spec.for_date, V = load(), open = false, armed = false;

    function fx(k, vars) {
      var s = F[k];
      if (s == null) throw new Error("i18n: no form string for " + k + " in " + (T.lang || "?"));
      return String(s).replace(/\{(\w+)\}/g, function (_, n) { return vars && vars[n] != null ? vars[n] : ""; });
    }
    function load() {
      try { var x = JSON.parse(window.localStorage.getItem(KEY) || "null"); if (x) return x; } catch (e) {}
      return {sessions: (spec.sessions || []).map(function (s) { return {type: s.type, ex: {}}; })};
    }
    function save() { try { window.localStorage.setItem(KEY, JSON.stringify(V)); } catch (e) {} }
    function field(k) { for (var i = 0; i < spec.fields.length; i++) if (spec.fields[i].key === k) return spec.fields[i]; return {}; }

    /* ---- small builders: every control carries data-* and is read through one listener ---- */
    function btn(act, attrs, label, on) {
      var a = ' data-act="' + act + '"';
      for (var k in attrs) a += " data-" + k + '="' + esc(String(attrs[k])) + '"';
      return '<button type="button" class="lf-b' + (on ? " on" : "") + '"' + a + ">" + esc(label) + "</button>";
    }
    function chips(k, opts, cur, labelOf, sess) {
      return '<div class="lf-row">' + opts.map(function (o) {
        var at = {k: k, v: o}; if (sess != null) at.s = sess;
        return btn("set", at, labelOf(o), String(cur) === String(o));
      }).join("") + "</div>";
    }
    function scale(k, cur, sess) {
      var f = field(k), out = [], half = f.step === 0.5;
      for (var i = f.min; i <= f.max; i++) out.push(i);
      var base = cur == null || cur === "" ? null : Math.floor(Number(cur));
      var html = chips(k, out, base, String, sess);
      if (half) {
        var at = {k: k}; if (sess != null) at.s = sess;
        html = html.replace(/<\/div>$/, btn("half", at, "+½", cur != null && Number(cur) % 1 !== 0) + "</div>");
      }
      return html;
    }
    function input(k, cur, type, sess, ph, mode) {
      var f = field(k);
      return '<input class="lf-in" type="' + type + '"' + (mode ? ' inputmode="' + mode + '"' : "") +
             (f.kind === "text" && f.max ? ' maxlength="' + f.max + '"' : "") +
             ' data-k="' + k + '"' + (sess != null ? ' data-s="' + sess + '"' : "") +
             (ph ? ' placeholder="' + esc(ph) + '"' : "") + ' value="' + esc(cur == null ? "" : String(cur)) + '">';
    }
    function hmIn(k, cur, sess) {     /* hours + minutes, as `k_h` and `k_m`: the session's duration, sleep, life load */
      cur = cur || {};
      return '<div class="lf-row">' + input(k + "_h", cur[k + "_h"], "number", sess, fx("hours"), "numeric") +
        '<span class="lf-u">' + esc(fx("hours")) + "</span>" + input(k + "_m", cur[k + "_m"], "number", sess, fx("minutes"), "numeric") +
        '<span class="lf-u">' + esc(fx("minutes")) + "</span></div>";
    }
    /* one row of the food list: the type as chips, `what` only for other, then how many and the
       grams in ONE — numbers the runner may leave blank (owner, 2026-10-20: "if the grams are not
       mandatory, a runner can choose to insert them anyway"). The labels say "in one": a total typed
       there would be multiplied by the quantity. */
    function fuelRow(r, i, j) {
      var F0 = field("fuel");
      function box(k, cur, type, mode, ph, max) {
        return '<input class="lf-in" type="' + type + '"' + (mode ? ' inputmode="' + mode + '"' : "") +
          (max ? ' maxlength="' + max + '"' : "") + ' data-k="fuel.' + k + '" data-s="' + i + '" data-j="' + j + '"' +
          (ph ? ' placeholder="' + esc(ph) + '"' : "") + ' value="' + esc(cur == null ? "" : String(cur)) + '">';
      }
      return '<div class="lf-ex lf-fuel">' +
        q(fx("fuel_kind"), '<div class="lf-row">' + F0.kinds.map(function (k) {
          return btn("fuelkind", {s: i, j: j, v: k}, fx("fuel_" + k), r.kind === k); }).join("") + "</div>") +
        (r.kind === "other" ? q(fx("fuel_what"), box("what", r.what, "text", "", fx("fuel_what_ph"), F0.what_max)) : "") +
        q(fx("fuel_qty"), box("qty", r.qty, "number", "numeric")) +
        q(fx("fuel_carb"), box("carb", r.carb, "number", "numeric")) +
        q(fx("fuel_prot"), box("prot", r.prot, "number", "numeric")) +
        '<div class="lf-row">' + btn("fueldrop", {s: i, j: j}, fx("remove")) + "</div></div>";
    }
    function q(label, body, hint) {
      return '<div class="lf-q"><div class="lf-l">' + esc(label) + (hint ? ' <span class="lf-h">' + esc(hint) + "</span>" : "") +
             "</div>" + body + "</div>";
    }
    function group(title, body) { return '<fieldset class="lf-g"><legend>' + esc(title) + "</legend>" + body + "</fieldset>"; }

    function session(s, i) {
      /* no duration on a lift (owner, 2026-10-20: "does it add something useful?" — it does not: a
         lift never debits the week's hours, knowledge/exchange-rates.md) */
      var out = q(fx("type"), chips("type", spec.types, s.type, function (o) { return fx("type_" + o); }, i)) +
        (s.type === "gym" ? "" : q(fx("dur"), hmIn("dur", s, i))) +
        q(fx("start"), input("start", s.start, "time", i));
      if (s.type === "gym") {
        out += q(fx("reps_left"), scale("reps_left", s.reps_left, i), fx("reps_left_hint"));
        if ((spec.exercises || []).length) {
          out += '<div class="lf-l">' + esc(fx("exercises")) + "</div>" + spec.exercises.map(function (e) {
            var x = (s.ex || {})[e.n] || {};
            return '<div class="lf-ex"><div class="lf-exn">' + e.n + ". " + esc(e.name) + "</div>" +
              '<div class="lf-row">' + spec.status.map(function (st) {
                return btn("ex", {s: i, n: e.n, v: st}, fx("st_" + st), x.status === st);
              }).join("") + "</div>" +
              '<input class="lf-in" type="text" data-k="exload" data-s="' + i + '" data-n="' + e.n +
              '" placeholder="' + esc(fx("load")) + '" value="' + esc(x.load || "") + '"></div>';
          }).join("");
        }
      } else {
        out += q(fx("km"), input("km", s.km, "number", i, "", "decimal")) +
          q(fx("up"), input("up", s.up, "number", i, "", "numeric")) +
          q(fx("down"), s.same ? "" : input("down", s.down, "number", i, "", "numeric"),
            "") + '<div class="lf-row">' + btn("same", {s: i}, fx("same_as_up"), !!s.same) + "</div>" +
          q(fx("rpe"), chips("rpe", ["2", "3", "3-4", "4", "4-5", "5", "6", "7", "8", "9"], s.rpe, String, i), fx("rpe_hint")) +
          '<div class="lf-l">' + esc(fx("fuel")) + ' <span class="lf-h">' + esc(fx("fuel_hint")) + "</span></div>" +
          (s.fuel || []).map(function (r, j) { return fuelRow(r, i, j); }).join("") +
          ((s.fuel || []).length < field("fuel").max ? '<div class="lf-row">' + btn("fueladd", {s: i}, fx("fuel_add")) + "</div>" : "") +
          q(fx("legs_after"), scale("legs_after", s.legs_after, i), fx("legs_ends"));
      }
      out += '<div class="lf-row">' + btn("drop", {s: i}, fx("remove")) + "</div>";   /* any session, the card's too */
      return group(fx("g_session") + (V.sessions.length > 1 ? " " + (i + 1) : ""), out);
    }

    function body() {
      var did = V.did, h = "";
      h += '<p class="lf-intro">' + esc(fx("intro")) + "</p>";
      h += group(fx("g_did"), chips("did", ["proposed", "different", "skipped", "rest"], did,
        function (o) { return o === "proposed" ? fx("done_proposed") : fx("did_" + o); }) +
        (did === "skipped" ? q(fx("skip_reason"), chips("skip_reason", field("skip_reason").options, V.skip_reason,
          function (o) { return fx("skip_" + o); })) : ""));
      h += group(fx("g_morning"),
        q(fx("legs"), scale("legs", V.legs), fx("legs_ends")) +
        q(fx("sleep_h"), hmIn("sleep_h", V)) +
        q(fx("sleep_q"), scale("sleep_q", V.sleep_q), fx("sleep_q_ends")) +
        q(fx("motivation"), scale("motivation", V.motivation), fx("motivation_ends")) +
        q(fx("stress"), scale("stress", V.stress), fx("stress_ends")) +
        q(fx("life_h"), hmIn("life_h", V)));
      if (spec.weekly) h += group(fx("g_weekly"),
        q(fx("weight"), input("weight", V.weight, "number", null, "", "decimal")) +
        q(fx("appetite"), chips("appetite", field("appetite").options, V.appetite, function (o) { return fx("app_" + o); })));
      if (did !== "skipped" && did !== "rest") {
        h += V.sessions.map(session).join("");
        if (V.sessions.length < spec.max_sessions) h += '<div class="lf-row">' + btn("add", {}, fx("add_session")) + "</div>";
      }
      if (spec.hill) {
        var H = V.hill || {};
        h += group(fx("g_hill"),
          q(fx("hill_time"), '<input class="lf-in" type="text" inputmode="numeric" data-k="hill.time" placeholder="34:10" value="' + esc(H.time || "") + '">') +
          q(fx("hill_rpe"), chips("hill.rpe", ["3", "3-4", "4", "5", "6", "7", "8"], H.rpe, String)) +
          q(fx("hill_pre_min"), input("hill.pre_min", H.pre_min, "number", null, "", "numeric")) +
          q(fx("hill_pre_up"), input("hill.pre_up", H.pre_up, "number", null, "", "numeric")) +
          q(fx("hill_pre_down"), input("hill.pre_down", H.pre_down, "number", null, "", "numeric")) +
          q(fx("hill_breakfast"), input("hill.breakfast", H.breakfast, "text")) +
          q(fx("hill_fuel"), input("hill.fuel", H.fuel, "text")) +
          q(fx("hill_temp"), input("hill.temp", H.temp, "number", null, "", "numeric")) +
          q(fx("hill_ground"), chips("hill.ground", ["dry", "wet", "snow"], H.ground, function (o) { return fx("gr_" + o); })));
      }
      h += group(fx("g_pain"), chips("pain", ["no", "yes"], V.pain, function (o) { return fx(o); }) +
        (V.pain === "yes" ?
          q(fx("pain_where"), chips("pain_where", spec.regions, V.pain_where, function (o) { return fx("region_" + o); })) +
          q(fx("pain_side"), chips("pain_side", ["left", "right", "both"], V.pain_side, function (o) { return fx("side_" + o); })) +
          q(fx("pain_kind"), chips("pain_kind", ["dull", "sharp"], V.pain_kind, function (o) { return fx("kind_" + o); })) +
          q(fx("pain_changed"), chips("pain_changed_run", ["no", "yes"], V.pain_changed_run, function (o) { return fx(o); }))
          : ""));
      h += group(fx("g_tomorrow"), q(fx("tomorrow_start"), input("tomorrow_start", V.tomorrow_start, "time")) +
        (spec.tomorrow_lift ? q(fx("tomorrow_lift"), input("tomorrow_lift", V.tomorrow_lift, "time")) : ""));
      if (spec.rebuild) h += group(fx("g_rebuild"), q(fx("rebuild_q"),
        chips("rebuild", ["yes", "not-yet"], V.rebuild, function (o) { return fx("rebuild_" + o); })));
      /* The note's cap is the contract's (bin/logform.py FIELDS `max`), said under the box and counted
         down as it fills (owner, 2026-10-17: a 690-character note was refused by a parser whose 400
         the form never showed). maxlength stops the box there; the parser refuses past it too. The
         countdown is the shell's #lf-left, right under the body (the note is its last group), set by
         out() like the progress line — so typing updates it without repainting. */
      var nmax = field("note").max;
      h += group(fx("g_note"), '<textarea class="lf-in lf-note" data-k="note" rows="3" maxlength="' + nmax + '">' +
        esc(V.note || "") + "</textarea>");
      return h;
    }

    function left() {
      var nmax = field("note").max;
      return fx("note_left", {max: nmax, n: Math.max(0, nmax - String(V.note || "").length)});
    }
    function answered() {
      var core = ["did", "legs", "sleep_h", "sleep_q", "motivation", "stress", "pain"], n = 0, m = core.length;
      core.forEach(function (k) { if (k === "sleep_h" ? hm(V.sleep_h_h, V.sleep_h_m) : V[k] != null && V[k] !== "") n++; });
      if (V.did !== "skipped" && V.did !== "rest") V.sessions.forEach(function (s) {
        if (s.type === "gym") { m += 1; if (s.reps_left) n++; return; }
        m += 2;
        if (duration(s)) n++;
        if (s.rpe) n++;
      });
      if (spec.hill) { m++; if (V.hill && V.hill.time) n++; }
      return [n, m];
    }
    function out() {
      var a = answered();
      el.progress.textContent = fx("progress", {n: a[0], m: a[1]});
      el.preview.textContent = composeLog(spec, V);
      if (el.left) el.left.textContent = left();
    }
    function paintAll() {
      // The caret is the page's CSS, from aria-expanded — the same rule as the card's folds
      // (owner, 2026-10-02: one accordion look); the open header turns yellow by the same attribute.
      el.toggle.textContent = fx("title");
      el.toggle.setAttribute("aria-expanded", open ? "true" : "false");
      el.body.hidden = !open; el.out.hidden = !open; if (el.left) el.left.hidden = !open;
      if (!open) return;
      el.body.innerHTML = body();
      el.actions.innerHTML = btn("copy", {}, fx("copy")) +
        (window.navigator && window.navigator.share ? btn("share", {}, fx("share")) : "") +
        btn("clear", {}, armed ? fx("clear_confirm") : fx("clear")) + '<span class="lf-note-out" data-role="note"></span>';
      out();
    }
    function sess(t) { var s = t.getAttribute("data-s"); return s == null || s === "" ? null : parseInt(s, 10); }
    function setv(k, v, s) {
      if (s != null) {
        V.sessions[s] = V.sessions[s] || {ex: {}}; V.sessions[s][k] = v;
        if (k === "type") V.sessions[s].picked = true;   /* the runner chose it: a report, not the card's guess */
        return;
      }
      if (k.indexOf("hill.") === 0) { V.hill = V.hill || {}; V.hill[k.slice(5)] = v; return; }
      V[k] = v;
    }
    function getv(k, s) {
      if (s != null) return (V.sessions[s] || {})[k];
      if (k.indexOf("hill.") === 0) return (V.hill || {})[k.slice(5)];
      return V[k];
    }
    function said(msg) {
      var a = el.actions.innerHTML;
      el.actions.innerHTML = a.replace(/<span class="lf-note-out"[^>]*>[\s\S]*?<\/span>/,
        '<span class="lf-note-out" data-role="note">' + esc(msg) + "</span>");
    }
    function copy() {
      var text = composeLog(spec, V);
      var nav = window.navigator;
      if (nav && nav.clipboard && nav.clipboard.writeText) {
        try { nav.clipboard.writeText(text).then(function () { said(fx("copied")); }, fallback); return; }
        catch (e) {}
      }
      fallback();
      function fallback() {
        el.copy.value = text; el.copy.hidden = false;
        try { el.copy.select(); if (document.execCommand && document.execCommand("copy")) { said(fx("copied")); return; } }
        catch (e) {}
        said(fx("copy_fallback"));
      }
    }
    function proposed() {
      V.did = (spec.sessions || []).length ? "proposed" : "rest";      // a rest card's "as proposed" is rest
      V.sessions = (spec.sessions || []).map(function (p, i) {
        var s = V.sessions[i] || {ex: {}};
        s.type = p.type;
        if (p.dur) { s.dur_h = Math.floor(p.dur / 60) || ""; s.dur_m = p.dur % 60; }
        if (p.rpe && !s.rpe) s.rpe = p.rpe;
        if (p.type === "gym") (spec.exercises || []).forEach(function (e) {
          s.ex = s.ex || {}; s.ex[e.n] = s.ex[e.n] || {}; if (!s.ex[e.n].status) s.ex[e.n].status = "as-written";
        });
        return s;
      });
    }

    function onClick(e) {
      var t = e.target;
      while (t && t !== root && !(t.getAttribute && t.getAttribute("data-act"))) t = t.parentNode;
      if (!t || t === root || !t.getAttribute) return;
      var act = t.getAttribute("data-act"), k = t.getAttribute("data-k"), v = t.getAttribute("data-v"), s = sess(t);
      if (act !== "clear") armed = false;
      if (act === "toggle") { open = !open; paintAll(); return; }
      if (act === "copy") { copy(); return; }
      if (act === "share") { try { window.navigator.share({text: composeLog(spec, V)}); } catch (x) {} return; }
      if (act === "clear") {
        if (!armed) { armed = true; paintAll(); return; }
        armed = false; try { window.localStorage.removeItem(KEY); } catch (x) {}
        V = load(); V.sessions = (spec.sessions || []).map(function (p) { return {type: p.type, ex: {}}; });
      } else if (act === "set" && k === "did" && v === "proposed") {
        /* "Done as proposed" fills the session from the card — and on a rest card it IS rest */
        var want = (spec.sessions || []).length ? "proposed" : "rest";
        if (V.did === want) V.did = ""; else proposed();
      } else if (act === "set") {
        var cur = getv(k, s);
        setv(k, String(cur) === String(v) ? "" : (/^-?\d+(\.\d+)?$/.test(v) && !/-/.test(v.slice(1)) ? Number(v) : v), s);
      } else if (act === "half") {
        var c = Number(getv(k, s));
        if (!isNaN(c) && getv(k, s) !== "" && getv(k, s) != null) {
          var f = field(k);
          setv(k, c % 1 ? c - 0.5 : Math.min(f.max, c + 0.5), s);
        }
      } else if (act === "same") { V.sessions[s].same = !V.sessions[s].same; }
      else if (act === "ex") {
        var x = V.sessions[s]; x.ex = x.ex || {}; var nn = t.getAttribute("data-n");
        x.ex[nn] = x.ex[nn] || {}; x.ex[nn].status = x.ex[nn].status === v ? "" : v;
      }
      else if (act === "fueladd") { var fs = V.sessions[s]; fs.fuel = fs.fuel || []; fs.fuel.push({kind: "", qty: 1}); }
      else if (act === "fuelkind" || act === "fueldrop") {
        var fr = V.sessions[s].fuel || [], fj = parseInt(t.getAttribute("data-j"), 10);
        if (act === "fueldrop") fr.splice(fj, 1);
        else if (fr[fj]) fr[fj].kind = fr[fj].kind === v ? "" : v;
      }
      else if (act === "add") { V.sessions.push({type: "run", ex: {}, added: true}); if (!V.did) V.did = "different"; }
      else if (act === "drop") { V.sessions.splice(s, 1); }
      save(); paintAll();
    }
    function onInput(e) {
      var t = e.target;
      if (!t || !t.getAttribute) return;
      var k = t.getAttribute("data-k");
      if (!k) return;
      var s = sess(t);
      if (k.indexOf("fuel.") === 0) {
        var row = ((V.sessions[s] || {}).fuel || [])[parseInt(t.getAttribute("data-j"), 10)];
        if (row) row[k.slice(5)] = t.value;
      } else if (k === "exload") {
        var x = V.sessions[s]; x.ex = x.ex || {}; var nn = t.getAttribute("data-n");
        x.ex[nn] = x.ex[nn] || {}; x.ex[nn].load = t.value;
      } else setv(k, t.value, s);
      save(); out();
    }
    root.addEventListener("click", onClick);
    root.addEventListener("input", onInput);
    paintAll();
  }

  /* ---- a folded section: its heading the button, its body CLOSED whenever the page opens
     (owner, 2026-10-02: Fuel today, then the recap). One function for both, so they cannot
     behave two ways. No title: the section stays hidden. --------------------------------- */
  function fold(id, title, md) {
    var sec = document.getElementById(id), body = document.getElementById(id + "-body"),
        tog = document.getElementById(id + "-toggle");
    sec.hidden = !title;
    document.getElementById(id + "-title").innerHTML = title ? inline(title) : "";
    body.innerHTML = title ? render(md) : "";
    body.hidden = true;
    tog.setAttribute("aria-expanded", "false");
    tog.addEventListener("click", function () {
      body.hidden = !body.hidden;
      tog.setAttribute("aria-expanded", body.hidden ? "false" : "true");
    });
  }

  /* ---- paint ------------------------------------------------------------------ */
  function paint(card) {
    var now = today(), age = daysBetween(card.for_date, now);
    var bar = document.getElementById("status"), txt = document.getElementById("statusText");

    /* The strip (owner, 2026-10-13): the runner's name and their race, the race a link to their
       plan — it replaced "The full plan →". Both from the payload: this shell is shared by every
       runner, and a name or a race baked in here once carried one runner's race onto another's
       card. Teal, or pink for a female runner (`female`, the profile's sex_at_birth). The date
       moved to the masthead; when the card is not today's the strip turns red and says so. */
    var race = esc(String(card.race_name || "")), who = '<b class="who">' + esc(String(card.runner_name || card.user || "")) +
      "</b>" + (race ? " - " + (card.plan_url ? '<a class="racelink" href="' + esc(card.plan_url).replace(/"/g, "&quot;") +
      '">' + race + "</a>" : race) : "");
    bar.className = "status" + (card.female ? " female" : "") + (age > 0 ? " stale" : "");
    txt.innerHTML = who + (age > 0 ? " &nbsp;·&nbsp; ⚠ " +
        t("status_past", {date: prettyLong(card.for_date), n: age, days: plural(age, "day", "days")}) :
      age < 0 ? " &nbsp;·&nbsp; " +
        t("status_ahead", {date: prettyLong(card.for_date), n: -age, days: plural(-age, "day", "days")}) : "");

    /* The masthead (owner, 2026-10-13): the card's date spelled out, then where the card sits —
       since 2026-10-16 its block, the block's dates and the weeks to race ("B0 (Re-entry) →
       07.09.2026 – 15.11.2026 | 77 weeks to race"), from the payload's `block` (the macro map,
       bin/card-embed.py:block_of_card); a card no block covers keeps the week counter. The title
       is the headline alone — the H1 without its `<Today> · <dow d mon> — ` prefix, computed once
       by bin/athlete.py:card_headline, which the plan page's calendar row reads too. */
    document.getElementById("eb-date").textContent = prettyLong(card.for_date);
    var dmy = function (iso) { var p = String(iso).split("-"); return p[2] + "." + p[1] + "." + p[0]; };
    document.getElementById("eb-week").textContent = (card.block
      ? card.block.code + " (" + card.block.name + ") → " + dmy(card.block.from) + " – " + dmy(card.block.to) + " | "
      : t("week") + " " + card.week + (card.total_weeks ? " " + t("of") + " " + card.total_weeks : "") + " · ") +
      card.weeks_to_race + " " + t("weeks_to_race");
    /* The third line (owner, 2026-10-25): the training week and its type, "Week 8 - down week",
       from the payload's `week_phase` (bin/card-embed.py:week_of_card) — the week counted from the
       plan's first week, never restarting at a block; the type the phase-map row the card's date
       falls in, in the runner's language (`week_types`, the plan page's words). No row: no line. */
    var wp = card.week_phase;
    document.getElementById("eb-phase").textContent = wp
      ? t("week") + " " + wp.n + " - " + ((T.week_types || {})[wp.type] || wp.type) : "";
    document.getElementById("title-head").textContent = card.headline || t("today");
    /* Relative links, from the payload: the card sits beside its runner's plan (index.html),
       one folder below the list of runners (../). Every word is the payload's `i18n` block. */
    var hl = document.getElementById("homelink");
    hl.textContent = t("home");
    if (card.home_url) { hl.href = card.home_url; hl.hidden = false; }
    else { hl.hidden = true; }
    document.getElementById("card-note").innerHTML = t("card_note");

    /* One tag per session (owner, 2026-10-13: "GYM - QUALITY", "RUN - RPE 3"): what it is and
       how hard — the lift by the card's `intensity`, a moving session by its RPE — read from the
       log form's sessions (bin/logform.py:spec, the one reader of the title), so a tag cannot name
       a session the form does not. No session, a rest day: the modality alone. */
    var S = (card.log_form && card.log_form.sessions) || [], tags = S.map(function (s) {
      return s.kind === "gym" ? [card.modality, card.intensity]
                              : [s.type || card.modality, s.rpe ? "RPE " + s.rpe : card.intensity];
    });
    if (!tags.length) tags = [[card.modality, card.intensity === card.modality ? "" : card.intensity]];
    document.getElementById("tags").innerHTML = tags.map(function (x) {
      return '<span class="tag"><b>' + esc(String(x[0] || "")) + "</b>" + (x[1] ? " - " + esc(String(x[1])) : "") + "</span>";
    }).join("");

    document.getElementById("stampL").title = "PLAN v" + (card.plan_version || "?") + " · " + t("card_written") +
      " " + (card.updated || card.generated_at || card.for_date);

    /* plan/health.md, written by bin/triggers.py after every log: a rebuild trigger that
       fired is said HERE, above the card, in the athlete's language — and nothing rebuilds
       until the runner says yes. No box when nothing fired. */
    var H = card.health, hb = document.getElementById("health");
    if (H && H.fired && H.fired.length) {
      var worst = H.fired.some(function (f) { return f.severity === "now"; }) ? "now"
                : (H.fired.some(function (f) { return f.severity === "soon"; }) ? "soon" : "later");
      hb.className = "health " + worst;
      hb.innerHTML = "<h2>⚠ " + esc(t("health_title")) + "</h2><ul>" +
        H.fired.map(function (f) {
          return "<li><b>" + esc(t("health_sev_" + f.severity) || f.severity) + "</b> · " +
                 esc(f.reason) + "<br>" + esc(t("health_do")) + "</li>";
        }).join("") + "</ul>";
    } else { hb.className = ""; hb.innerHTML = ""; }

    /* The five-minute strength test — the same box as the plan page, on a strength day only
       (bin/strength-test.py decides; card-embed.py passes `show` false on any other day). */
    paintStrengthTest(card.strength_test, document.getElementById("strength-test"));

    /* The card, cut around its fuel section: what comes before it open (the session), then —
       after the log form, which sits between them in the markup — the fuel section folded and
       closed, then the recap — `## <recap_heading>`, the only section allowed after fuel
       (bin/check.py:rule_card_sections) — folded and closed too. */
    /* The order of a two-session day (owner, 2026-10-20), before the first box: `any`, or
       `<type>-first` naming one of the form's two sessions (bin/logform.py:spec, the one reader of
       the title), each called by its box's name — Strength, Running, or the form's word for the
       stacked type — lower-cased mid-sentence except in German. Anything else paints nothing:
       bin/check.py:rule_session_order refuses it before the page is built. */
    var on = document.getElementById("order-note"), OS = (card.log_form && card.log_form.sessions) || [];
    on.textContent = "";
    if (OS.length === 2 && card.order) {
      var nm = function (s) {
        var w = s.type === "gym" ? t("section_strength") : s.type === "run" ? t("section_run")
              : ((card.form_i18n || {})["type_" + s.type] || s.type);
        return T.lang === "de" ? w : w.toLowerCase();
      };
      var first = OS.filter(function (s) { return card.order === s.type + "-first"; })[0];
      if (card.order === "any") on.textContent = t("order_any", {a: nm(OS[0]), b: nm(OS[1])});
      else if (first) on.textContent = t("order_first", {a: nm(OS[0]), b: nm(OS[1]), first: nm(first),
        second: nm(OS.filter(function (s) { return s !== first; })[0])});
    }
    on.hidden = !on.textContent;
    var parts = cutCard(card.markdown);                  // card-render.js — the diary's cut too
    document.getElementById("card").innerHTML = sessionBoxes(parts.session);   // one box per section

    /* Under the sessions (owner, 2026-10-13). On a lifting day — `modality: gym`, the machine
       field, never the prose — the general advice that the two RPE scales read the same number
       two opposite ways; then the four reference pages, on every card. Both from `T`. */
    var rn = document.getElementById("rpe-note");
    rn.hidden = card.modality !== "gym";
    rn.innerHTML = rn.hidden ? "" : "<h2>⚠ " + esc(t("rpe_note_title")) + "</h2><p>" + t("rpe_note") + "</p>";
    var R = card.ref_urls || {};
    document.getElementById("refs").innerHTML = '<span class="refs-h">' + esc(t("refs_title")) + "</span>" +
      [["library", "ref_library"], ["rpe_lift", "ref_rpe_lift"], ["rpe_run", "ref_rpe_run"], ["races", "ref_races"]].map(function (x) {
        return '<a href="' + esc(R[x[0]] || "").replace(/"/g, "&quot;") + '">' + esc(t(x[1])) + "</a>";
      }).join("");
    fold("fuel", parts.fuelTitle, parts.fuel);
    /* The recap is the one section after the fuel (CARD-ORDER); anything else there is folded
       in under it rather than dropped. */
    var f = parts.folds, last = f.length ? f[f.length - 1] : null;
    fold("recap", last ? last.title : "", f.slice(0, -1).reduce(function (acc, x) {
      return acc + "\n## " + x.title + "\n" + x.md; }, last ? last.md : ""));

    /* The log form, under the session: tap, Copy, paste into Claude. Its fields are bin/logform.py's
       contract (the payload's `log_form`), its words the payload's `form_i18n`. */
    paintLogForm(card, {section: document.getElementById("logform"), toggle: document.getElementById("lf-toggle"),
      body: document.getElementById("lf-body"), left: document.getElementById("lf-left"), out: document.getElementById("lf-out"),
      progress: document.getElementById("lf-progress"), preview: document.getElementById("lf-preview"),
      actions: document.getElementById("lf-actions"), copy: document.getElementById("lf-copy")}, card.form_i18n);
  }

  paint(EMBEDDED);
})();
</script>
